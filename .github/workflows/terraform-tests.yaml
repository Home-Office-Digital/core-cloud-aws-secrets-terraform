name: Terraform Module Tests

on:
  pull_request:
    paths:
      - "*.tf"
      - "secret_and_role/**"
      - "tests/**"
      - ".github/workflows/terraform-tests.yaml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.0"
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  terraform-tests:
    name: Terraform Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Comment Format Issues (sticky)
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `<!-- tf-tests-fmt -->`;
            const body = `${marker}
            ## ⚠️ terraform fmt check failed

            Please run:
            \`\`\`
            terraform fmt -recursive
            \`\`\`
            and commit the changes.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on Format Issues
        if: steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Block apply-based tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include="*.tftest.hcl" 'command *= *apply' tests/; then
            echo "::error::Apply-based Terraform tests are not allowed in CI."
            exit 1
          fi

      - name: Run Terraform Tests
        id: test
        shell: bash
        run: |
          set -euo pipefail
          terraform test -no-color -verbose 2>&1 | tee test-results.log
          sed -r 's/\x1B\[[0-9;]*[mK]//g' test-results.log > test-results.clean.log

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          echo "## Terraform Unit Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f test-results.clean.log ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 test-results.clean.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No test log found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-results
          path: |
            test-results.log
            test-results.clean.log
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR with Results (sticky)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-tests-results -->`;
            const path = `test-results.clean.log`;

            if (!fs.existsSync(path)) {
              console.log('No clean test log found; skipping comment');
              return;
            }

            const text = fs.readFileSync(path, 'utf8');
            const passed = text.includes('Success!');
            const icon = passed ? '✅' : '❌';

            const body = `${marker}
            ## ${icon} Terraform Unit Test Results

            <details>
            <summary>📋 Test Output</summary>

            \`\`\`
            ${text.slice(-6000)}
            \`\`\`

            </details>

            - **Status**: ${passed ? "passed" : "failed"}
            - **Terraform Version**: ${{ env.TF_VERSION }}

            > This comment is automatically updated on each push.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  quality-gate:
    name: Quality Gate (Required Check)
    needs: [terraform-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Quality Gate
        run: |
          if [[ "${{ needs.terraform-tests.result }}" != "success" ]]; then
            echo "::error::Quality gate failed — Terraform tests did not pass"
            exit 1
          fi
          echo "::notice::Quality gate passed — all tests successful"

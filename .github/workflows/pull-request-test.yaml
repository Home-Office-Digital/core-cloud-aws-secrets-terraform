name: Terraform Unit Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.tf"
      - "secret_and_role/**"
      - ".github/workflows/pull-request-test.yaml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.0"
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  terraform-tests:
    name: Terraform Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Comment Format Issues (sticky)
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `<!-- tf-tests-fmt -->`;
            const body = `${marker}
            ## ⚠️ terraform fmt check failed

            Please run:
            \`\`\`
            terraform fmt -recursive
            \`\`\`
            and commit the changes.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on Format Issues
        if: steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Terraform Init
        run: terraform -chdir=secret_and_role init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=secret_and_role validate -no-color

      - name: Block apply-based tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include="*.tftest.hcl" 'command *= *apply' secret_and_role/tests/; then
            echo "::error::Apply-based Terraform tests are not allowed in CI."
            exit 1
          fi

      - name: Run Terraform Tests
        id: terraform-test
        shell: bash
        run: |
          set +e
          terraform -chdir=secret_and_role test -verbose -no-color 2>&1 | tee test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          PASSED=$(grep -c "^  run " test_output.txt || true)
          FAILED=$(grep -c "FAIL" test_output.txt || true)

          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT_CODE

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          echo "## Terraform Unit Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f test_output.txt ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -50 test_output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No test log found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-results
          path: test_output.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.terraform-test.outputs.passed }}' || '0';
            const failed = '${{ steps.terraform-test.outputs.failed }}' || '0';
            const exitCode = '${{ steps.terraform-test.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ pass' : '❌ fail';
            const overall = exitCode === '0'
              ? `✅ Overall: passed=${passed}, failed=0, errored=0, skipped=0`
              : `❌ Overall: passed=${passed}, failed=${failed}, errored=0, skipped=0`;

            const body = `## Terraform Test Results\n\n${overall}\n\n| Repo | Status | Passed | Failed |\n|------|--------|--------|--------|\n| core-cloud-aws-secrets-terraform | ${status} | ${passed} | ${failed} |`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  quality-gate:
    name: Quality Gate (Required Check)
    needs: [terraform-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Quality Gate
        run: |
          if [[ "${{ needs.terraform-tests.result }}" != "success" ]]; then
            echo "::error::Quality gate failed — Terraform tests did not pass"
            exit 1
          fi
          echo "::notice::Quality gate passed — all tests successful"
